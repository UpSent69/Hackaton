# API-шлюз: единая точка входа в бэкенд. Фронтенд отправляет сюда все запросы /api/,
# шлюз раскидывает их по микросервисам. ai-service HTTP наружу не отдаёт — задачи
# получает из Kafka.
#
# Адреса сервисов берутся у DNS Docker при каждом запросе (resolver + переменная):
# после пересоздания контейнера его IP меняется, и запомненный при старте адрес
# мог бы указывать уже на другой сервис.
server {
    listen 80;
    client_max_body_size 13m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Адрес пользователя приходит от фронтенда в X-Real-IP — по нему ограничивается частота входа.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Лента уведомлений — notification-service.
    location = /api/alerts {
        set $notification http://notification-service:8080;
        proxy_pass $notification;
    }

    # Всё остальное API сайта — core.
    location /api/ {
        set $core http://core:8080;
        proxy_pass $core;
    }
}
