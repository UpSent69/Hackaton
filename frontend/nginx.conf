server {
    listen 80;
    server_name localhost;

    # Файлы заявок и накладных (фото, PDF, Excel) — до 12 МБ, как принимает бэкенд,
    # плюс служебная обёртка multipart. По умолчанию nginx пропускает только 1 МБ.
    client_max_body_size 13m;

    # 1. Раздача статических файлов (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Поддержка роутинга (например, #/stock) и прямых ссылок на .html файлы
        try_files $uri $uri/ $uri.html /index.html;
        # Браузер каждый раз сверяется с сервером (по ETag — без повторной загрузки, если файл
        # не менялся). Иначе после обновления сайта он держит старые html/js из кэша.
        add_header Cache-Control "no-cache" always;
    }

    # 2. Проксирование всех запросов к /api/ на Go-бэкенд
    location /api/ {
        # Имя "backend" должно точно совпадать с именем сервиса в docker-compose.yml
        proxy_pass http://backend:8080/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}