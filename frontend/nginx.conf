server {
    listen 80;
    server_name localhost;

    # Файлы заявок и накладных (фото, PDF, Excel) — до 12 МБ, как принимает бэкенд,
    # плюс служебная обёртка multipart. По умолчанию nginx пропускает только 1 МБ.
    client_max_body_size 13m;

    # 1. Раздача статических файлов (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Поддержка роутинга (например, #/stock) и прямых ссылок на .html файлы
        try_files $uri $uri/ $uri.html /index.html;
        # Браузер каждый раз сверяется с сервером (по ETag — без повторной загрузки, если файл
        # не менялся). Иначе после обновления сайта он держит старые html/js из кэша.
        add_header Cache-Control "no-cache" always;
    }

    # 2. Все запросы к /api/ уходят в API-шлюз (gateway), он раскидывает их по микросервисам
    location /api/ {
        # Адрес шлюза берётся у DNS Docker при каждом запросе: после пересоздания контейнера IP меняется.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://gateway;
        proxy_pass $gateway;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}