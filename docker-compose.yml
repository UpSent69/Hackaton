services:
  backend:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: hackaton-backend
    environment:
      SQLITE_DB_PATH: /root/data/app.db
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - db_data:/root/data
    networks:
      - app-network
    restart: unless-stopped

  # Redis: сессии, кэш, ревизия данных, ограничение частоты и очередь распознавания документов.
  # Основные данные склада остаются в SQLite; без Redis бэкенд продолжает работать.
  redis:
    image: redis:7.4-alpine
    container_name: hackaton-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

  ollama:
    profiles:
      - container-ollama
    image: ollama/ollama:latest
    container_name: hackaton-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackaton-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
  redis_data:

networks:
  app-network:
    driver: bridge
